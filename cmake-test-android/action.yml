name: cmake-test-android
description: "Boot an Android emulator and run native test binaries"

inputs:
  PRESET:
    required: true
    description: "CMake configure preset name (used to locate the build directory; `inherits` is resolved)"
  TEST_BINARIES:
    required: false
    default: ""
    description: "Space-separated list of test binary names (e.g. 'test_core test_state'). If empty, auto-discovers all test_* binaries in the build tree."
  API_LEVEL:
    required: false
    default: "24"
    description: "Android API level for the emulator"
  ARCH:
    required: false
    default: "x86_64"
    description: "Emulator architecture"
  TARGET:
    required: false
    default: "default"
    description: "Emulator system-image target (e.g. google_apis)"
  DEVICE_DIR:
    required: false
    default: "/data/local/tmp/tanh"
    description: "Staging directory on the device; binaries and EXTRA_PUSH_PATHS land here"
  EXTRA_PUSH_PATHS:
    required: false
    default: ""
    description: "Newline-separated host files/directories pushed into DEVICE_DIR before the run (shared libraries, model trees, libc++_shared.so, ...). Missing paths are skipped with a note."
  RUN_ENV:
    required: false
    default: ""
    description: "Environment prefix for each test invocation, e.g. 'LD_LIBRARY_PATH=/data/local/tmp/tanh'"

runs:
  using: "composite"
  steps:
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Resolve build directory and stage the run script
      id: resolve
      shell: bash
      env:
        EXTRA_PUSH_PATHS: ${{ inputs.EXTRA_PUSH_PATHS }}
        RUN_ENV: ${{ inputs.RUN_ENV }}
        DEVICE_DIR: ${{ inputs.DEVICE_DIR }}
      run: |
        BUILD_DIR=$(python3 -c "
        import json, sys

        with open('CMakePresets.json') as f:
            presets = json.load(f)['configurePresets']

        def binary_dir(name):
            for p in presets:
                if p['name'] == name:
                    if 'binaryDir' in p:
                        return p['binaryDir']
                    inherits = p.get('inherits', [])
                    if isinstance(inherits, str):
                        inherits = [inherits]
                    for parent in inherits:
                        found = binary_dir(parent)
                        if found:
                            return found
            return None

        found = binary_dir('${{ inputs.PRESET }}')
        if not found:
            sys.exit(1)
        print(found.replace('\${sourceDir}', '.'))
        ")
        echo "Build directory: $BUILD_DIR"

        BINARIES="${{ inputs.TEST_BINARIES }}"
        if [ -z "$BINARIES" ]; then
          # Auto-discover: find ELF test binaries (cross-compiled, not host-executable)
          BINARIES=$(find "$BUILD_DIR/test" -name "test_*" -type f ! -name "*.cpp" ! -name "*.o" ! -name "*.cmake" ! -name "*.d" 2>/dev/null \
            | while read f; do file "$f" | grep -q ELF && basename "$f"; done \
            | sort | tr '\n' ' ')
        fi
        if [ -z "$BINARIES" ]; then
          echo "ERROR: No test binaries found in $BUILD_DIR/test"
          exit 1
        fi
        echo "Test binaries: $BINARIES"

        # One committed script the emulator-runner invokes as a single line
        # (it executes each inline line in its own shell). Staging, env and
        # marker-based exit codes live here; failures are collected so one run
        # reports every broken suite.
        {
          echo 'set -u'
          echo "DEV='$DEVICE_DIR'"
          echo 'adb shell "rm -rf $DEV && mkdir -p $DEV"'
          for b in $BINARIES; do
            p=$(find "$BUILD_DIR/test" -name "$b" -type f | head -1)
            echo "adb push '$p' \"\$DEV/$b\""
            echo "adb shell \"chmod 755 \$DEV/$b\""
          done
          if [ -n "$EXTRA_PUSH_PATHS" ]; then
            printf '%s\n' "$EXTRA_PUSH_PATHS" | while IFS= read -r path; do
              [ -n "$path" ] || continue
              echo "if [ -e '$path' ]; then adb push '$path' \"\$DEV/\"; else echo 'skipping missing extra path: $path'; fi"
            done
          fi
          echo 'FAILED=0'
          for b in $BINARIES; do
            # adb shell does not propagate exit codes, hence the echoed marker.
            echo "adb shell \"cd \$DEV && $RUN_ENV ./$b --gtest_brief=1; echo TANH_EXIT=\\\$?\" | tee \"/tmp/out_$b.txt\""
            echo "grep -q 'TANH_EXIT=0' \"/tmp/out_$b.txt\" || { echo \"FAILED: $b\"; FAILED=1; }"
          done
          echo 'exit $FAILED'
        } > /tmp/tanh-android-test.sh
        echo "--- staged run script:"
        cat /tmp/tanh-android-test.sh

    - name: Run tests on Android emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.API_LEVEL }}
        arch: ${{ inputs.ARCH }}
        target: ${{ inputs.TARGET }}
        emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
        disable-animations: true
        script: bash /tmp/tanh-android-test.sh
