name: warm-caches

# Reusable push-to-main cache warmer: BUILDS, never tests (the merge queue
# already validated the identical tree). Exists because Actions caches are
# branch-scoped — entries written by queue or PR runs are not restorable
# elsewhere, so warm compile caches and the fixture entry must be produced on
# the default branch's scope.
#
# warm_matrix rows: { name, os, preset, args?, vcvars? }
# fetch_command: run when the models cache key misses (e.g. `cmake -P
# extras/fetch-models.cmake`); empty skips the seed job.

on:
  workflow_call:
    inputs:
      warm_matrix:
        description: "JSON array of build-only legs"
        type: string
        required: true
      models_cache_prefix:
        type: string
        default: ""
      models_hash_glob:
        type: string
        default: ""
      models_cache_paths:
        type: string
        default: ""
      fetch_command:
        type: string
        default: ""

env:
  SCCACHE_GHA_ENABLED: "true"
  # Without this, sccache speaks the retired v1 cache API and every write fails.
  ACTIONS_CACHE_SERVICE_V2: "on"
jobs:
  seed_models_cache:
    name: seed the model-fixture cache
    if: inputs.fetch_command != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore or create the cache entry
        id: models_cache
        uses: actions/cache@v4
        with:
          path: ${{ inputs.models_cache_paths }}
          key: ${{ inputs.models_cache_prefix }}-${{ hashFiles(inputs.models_hash_glob) }}
          enableCrossOsArchive: true
      - name: fetch the pinned fixtures
        if: steps.models_cache.outputs.cache-hit != 'true'
        run: ${{ inputs.fetch_command }}

  warm:
    name: warm / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.warm_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: get repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: restore the model fixtures
        if: inputs.models_cache_prefix != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.models_cache_paths }}
          key: ${{ inputs.models_cache_prefix }}-${{ hashFiles(inputs.models_hash_glob) }}
          enableCrossOsArchive: true
      - name: setup build tools
        uses: tanh-lab/ci-actions/setup-cpp-build-tools@v0.3.3
      - name: MSVC environment
        if: matrix.vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}
      - name: build
        uses: tanh-lab/ci-actions/cmake-build@v0.3.3
        with:
          PRESET: ${{ matrix.preset }}
          CMAKE_BUILD_ARGS: ${{ matrix.args }}
